name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
  # Reused by release.yml so a release only ships what passed the full CI.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check THIRD_PARTY_NOTICES is up to date
        run: |
          scripts/gen-notices.sh > THIRD_PARTY_NOTICES
          git diff --exit-code THIRD_PARTY_NOTICES || {
            echo "::error::THIRD_PARTY_NOTICES is stale, run 'make notices' and commit it"; exit 1; }
